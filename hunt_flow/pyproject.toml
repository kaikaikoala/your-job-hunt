[project]
name = "hunt_flow"
version = "0.1.0"
description = "hunt_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crawl4ai>=0.8.0",
    "crewai[google-genai,tools]==1.9.3",
    "pytest>=9.0.2",
]

[project.scripts]
kickoff = "hunt_flow.main:kickoff"
run_crew = "hunt_flow.main:kickoff"
plot = "hunt_flow.main:plot"
run_with_trigger = "hunt_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
