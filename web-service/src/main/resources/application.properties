spring.config.import=optional:file:./.env.local[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobhunt}
spring.datasource.username=${DB_USER:jobhunt}
spring.datasource.password=${DB_PASSWORD:jobhunt}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

agent.grpc.host=${AGENT_GRPC_HOST:localhost}
agent.grpc.port=${AGENT_GRPC_PORT:50051}

app.token.encryption-key=${TOKEN_ENCRYPTION_KEY:}
app.gmail.client-id=${GMAIL_CLIENT_ID:}
app.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
