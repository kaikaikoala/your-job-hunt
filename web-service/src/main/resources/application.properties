spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobhunt}
spring.datasource.username=${DB_USER:jobhunt}
spring.datasource.password=${DB_PASSWORD:jobhunt}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Set FIREBASE_SERVICE_ACCOUNT to the full service account JSON string
