databases:
  - name: jobhunt-db
    plan: free
    databaseName: jobhunt

services:
  - type: web
    name: jobhunt-api
    env: docker
    dockerfilePath: ./web-service/Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: jobhunt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jobhunt-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jobhunt-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: jobhunt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jobhunt-db
          property: password

  - type: web
    name: jobhunt-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://jobhunt-api.onrender.com
