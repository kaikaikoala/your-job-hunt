databases:
  - name: jobhunt-db
    databaseName: jobhunt

services:
  - type: web
    name: jobhunt-api
    env: docker
    dockerfilePath: ./web-service/Dockerfile
    dockerContext: .
    domains:
      - api.your-job-hunt.com
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: jobhunt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jobhunt-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jobhunt-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: jobhunt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jobhunt-db
          property: password
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN
        value: https://your-job-hunt.com
      - key: AGENT_GRPC_HOST
        value: jobhunt-agent # Render private network hostname for the agent service
      - key: EMAIL_WORKER_URL
        value: http://jobhunt-email-worker:8001

  - type: pserv
    name: jobhunt-agent
    env: docker
    dockerfilePath: ./agent-service/Dockerfile
    dockerContext: .
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_SERVICE_URL
        value: http://jobhunt-api-8cwf:8080

  - type: pserv
    name: jobhunt-email-worker
    env: docker
    dockerfilePath: ./email-worker/Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: jobhunt-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jobhunt-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jobhunt-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: jobhunt-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jobhunt-db
          property: password
      - key: GEMINI_API_KEY
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false

  - type: web
    name: jobhunt-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    domains:
      - your-job-hunt.com
    headers:
      - path: /sign-in
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://api.your-job-hunt.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_GMAIL_CLIENT_ID
        sync: false
